<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday ❤️</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    }

    .box{
      text-align:center;
      background:white;
      padding:50px 40px;
      border-radius:20px;
      box-shadow:0 10px 25px rgba(0,0,0,0.2);
      animation: slideIn 0.8s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1{
      color:#ff4081;
      font-size:48px;
      margin-bottom:20px;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    p{
      margin-bottom:30px;
      color:#444;
      font-size:18px;
      line-height:1.6;
    }

    .button-container{
      display:flex;
      gap:20px;
      justify-content:center;
      flex-wrap:wrap;
    }

    button{
      background:#ff4081;
      color:white;
      border:none;
      padding:15px 35px;
      border-radius:30px;
      font-size:18px;
      cursor:pointer;
      transition:all 0.3s ease;
      font-weight:bold;
    }

    button:hover{
      background:#e91e63;
      transform:scale(1.05);
      box-shadow:0 5px 15px rgba(233, 30, 99, 0.4);
    }

    button:active{
      transform:scale(0.98);
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>🎂 Happy Birthday! ❤️</h1>
    <p>
      Wishing you the most beautiful day filled with love, joy, and happiness!<br><br>
      You deserve all the best in life! 🌹
    </p>
    
    <div class="button-container">
      <button onclick="goToPage('memory.html')">📸 View Memories</button>
      <button onclick="goToPage('surprise.html')">🎁 See Surprise</button>
    </div>
  </div>

  <script>
    function goToPage(page) {
      window.location.href = page;
    }
  </script>
</body>
</html>
