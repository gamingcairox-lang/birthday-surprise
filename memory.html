<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Memories ❤️</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:linear-gradient(135deg,#ffe6f0,#fff5f7);
      padding:20px;
      min-height:100vh;
    }

    .container{
      max-width:1000px;
      margin:0 auto;
    }

    h1{
      text-align:center;
      color:#ff4081;
      margin-bottom:30px;
      font-size:36px;
      animation: slideDown 0.6s ease-out;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .gallery{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
      margin-bottom:40px;
    }

    .gallery-item{
      position:relative;
      border-radius:15px;
      overflow:hidden;
      box-shadow:0 8px 20px rgba(0,0,0,0.15);
      cursor:pointer;
      transition:transform 0.3s ease;
      animation: fadeIn 0.6s ease-out backwards;
    }

    .gallery-item:nth-child(1) { animation-delay: 0.1s; }
    .gallery-item:nth-child(2) { animation-delay: 0.2s; }
    .gallery-item:nth-child(3) { animation-delay: 0.3s; }
    .gallery-item:nth-child(4) { animation-delay: 0.4s; }
    .gallery-item:nth-child(5) { animation-delay: 0.5s; }
    .gallery-item:nth-child(6) { animation-delay: 0.6s; }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .gallery-item:hover{
      transform:scale(1.05);
    }

    .gallery-item img{
      width:100%;
      height:250px;
      object-fit:cover;
      display:block;
    }

    .text-center{
      text-align:center;
      margin-bottom:30px;
    }

    p{
      color:#444;
      font-size:18px;
      margin-bottom:15px;
    }

    .button-container{
      display:flex;
      gap:15px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top:20px;
    }

    button{
      padding:12px 30px;
      border:none;
      border-radius:30px;
      background:#ff4081;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:all 0.3s ease;
      font-weight:bold;
    }

    button:hover{
      background:#e91e63;
      transform:scale(1.05);
      box-shadow:0 5px 15px rgba(233, 30, 99, 0.4);
    }

    button:active{
      transform:scale(0.98);
    }

    .modal{
      display:none;
      position:fixed;
      z-index:1000;
      left:0;
      top:0;
      width:100%;
      height:100%;
      background-color:rgba(0,0,0,0.8);
      animation: fadeIn 0.3s ease-out;
    }

    .modal-content{
      position:relative;
      margin:auto;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100%;
    }

    .modal-image{
      max-width:90%;
      max-height:90%;
      animation: zoomIn 0.3s ease-out;
    }

    @keyframes zoomIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .close{
      position:absolute;
      right:30px;
      top:20px;
      color:#fff;
      font-size:40px;
      font-weight:bold;
      cursor:pointer;
      transition:color 0.3s ease;
    }

    .close:hover{
      color:#ff4081;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>📸 Our Beautiful Memories ❤️</h1>

    <div class="gallery">
      <div class="gallery-item" onclick="openModal(this.querySelector('img').src)">
        <img src="photo1.jpg" alt="Memory 1">
      </div>
      <div class="gallery-item" onclick="openModal(this.querySelector('img').src)">
        <img src="photo2.jpg" alt="Memory 2">
      </div>
      <div class="gallery-item" onclick="openModal(this.querySelector('img').src)">
        <img src="photo3.jpg" alt="Memory 3">
      </div>
      <div class="gallery-item" onclick="openModal(this.querySelector('img').src)">
        <img src="photo4.jpg" alt="Memory 4">
      </div>
      <div class="gallery-item" onclick="openModal(this.querySelector('img').src)">
        <img src="photo5.jpg" alt="Memory 5">
      </div>
      <div class="gallery-item" onclick="openModal(this.querySelector('img').src)">
        <img src="photo6.jpg" alt="Memory 6">
      </div>
    </div>

    <div class="text-center">
      <p>❤️ Every moment with you is precious! These memories make my heart smile!</p>
    </div>

    <div class="button-container">
      <button onclick="goBack()">← Back Home</button>
      <button onclick="goToPage('surprise.html')">Next: Surprise →</button>
    </div>
  </div>

  <!-- Modal for full size images -->
  <div id="imageModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <img id="modalImage" class="modal-image" src="">
    </div>
  </div>

  <script>
    function openModal(imageSrc) {
      document.getElementById('imageModal').style.display = 'block';
      document.getElementById('modalImage').src = imageSrc;
    }

    function closeModal() {
      document.getElementById('imageModal').style.display = 'none';
    }

    window.onclick = function(event) {
      const modal = document.getElementById('imageModal');
      if (event.target == modal) {
        modal.style.display = 'none';
      }
    }

    function goBack() {
      window.location.href = 'index.html';
    }

    function goToPage(page) {
      window.location.href = page;
    }
  </script>
</body>
</html>
